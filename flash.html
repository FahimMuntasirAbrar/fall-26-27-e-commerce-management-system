<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash sale timer - Online Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="flash">
  <section id="app" class="app">
    <nav class="side">
      <p class="logo">Seller</p>
      <a class="tab" href="items.html">My items</a>
      <a class="tab" href="price.html">Smart price calculator</a>
      <a class="tab on" href="flash.html">Flash sale timer</a>
      <a class="tab" href="combo.html">Combo offer builder</a>
      <a class="tab" href="reply.html">Quick reply templates</a>
      <a class="tab" href="goal.html">Monthly sales target</a>
    </nav>
    <main class="main">
      <header class="top">
        <h2>Flash sale timer</h2>
        <section class="who">
          <p id="who"></p>
          <button class="btn ghost sm" id="logout">Log out</button>
        </section>
      </header>
      <section id="v-flash">
        <section class="panel space-b">
          <form class="row-form" id="fForm">
            <section class="inline-field">
              <label for="fProd">Item</label>
              <select id="fProd"></select>
            </section>
            <section class="inline-field">
              <label for="fPrice">Price</label>
              <input type="text" id="fPrice" readonly>
            </section>
            <section class="inline-field">
              <label for="fDisc">Discount (%)</label>
              <input type="number" id="fDisc" min="1" max="90" value="20">
            </section>
            <section class="inline-field">
              <label for="fSalePrice">Sale Price</label>
              <input type="text" id="fSalePrice" readonly>
            </section>
            <section class="inline-field">
              <label for="fMin">Duration (minutes)</label>
              <input type="number" id="fMin" min="1" max="10080" value="60">
            </section>
            <button class="btn gold" type="submit">Start sale</button>
          </form>
          <p class="note">The sale ends by itself when the timer reaches zero.</p>
        </section>
        <section class="panel">
          <h3>Active sales</h3>
          <section id="fList"></section>
        </section>
      </section>
     <footer>&copy; 2026 Online Marketplace-Dhaka,Bangladesh</footer>
    </main>
  </section>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
