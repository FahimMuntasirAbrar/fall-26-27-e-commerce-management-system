<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Online Marketplace</title>
  <link rel="stylesheet" href="css/seller.css">
</head>
<body>
  <header>
    <h1>Online Marketplace</h1>
  </header>
  <main>
    <section id="login" class="auth">
      <section class="auth-side">
        <h2>Your shop, open all day.</h2>
        <p>Manage your items, sales and customers from one place.</p>
      </section>
      <form id="loginForm" class="auth-form">
        <h2>Log in</h2>
        <label for="lEmail">Email</label>
        <input type="email" id="lEmail">
        <span class="error" id="lEmailErr"></span>
        <label for="lPass">Password</label>
        <input type="password" id="lPass">
        <span class="error" id="lPassErr"></span>
        <p class="msg" id="lMsg"></p>
        <button class="btn" type="submit">Log in</button>
        <p class="swap">New seller? <a href="seller-signup.html">Create an account</a></p>
      </form>
    </section>
  </main>
  <script src="js/seller-data.js"></script>
  <script src="js/seller-app.js"></script>
</body>
</html>
